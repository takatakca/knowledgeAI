name: Private Knowledge Security CI

on:
  push:
    branches: [main]
    paths:
      - 'private-knowledge/**'
      - '.github/workflows/private-knowledge-tests.yml'
  pull_request:
    paths:
      - 'private-knowledge/**'
      - '.github/workflows/private-knowledge-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-and-tenant-tests:
    name: Signed JWT and private service unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check private-knowledge/src/auth.cjs
          node --check private-knowledge/src/service.cjs
          node --check private-knowledge/src/access.cjs
          node --check private-knowledge/src/rate-limit.cjs
          node --check private-knowledge/src/source-approval.cjs
          node --check private-knowledge/src/preflight.cjs
          node --check private-knowledge/src/server.cjs
      - name: Authorization, input and transaction tests
        run: node --test private-knowledge/tests/private.test.cjs private-knowledge/tests/access.test.cjs private-knowledge/tests/preflight.test.cjs private-knowledge/tests/rate-limit.test.cjs private-knowledge/tests/source-approval.test.cjs

  postgres-rls:
    name: PostgreSQL 17 tenant-isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name knowledge-private-ci \
            -e POSTGRES_PASSWORD=local-ci-only \
            -e POSTGRES_DB=knowledgeci \
            -p 127.0.0.1:5433:5432 \
            postgres:17
          for attempt in $(seq 1 45); do
            if docker exec knowledge-private-ci pg_isready -U postgres -d knowledgeci; then
              exit 0
            fi
            sleep 2
          done
          docker logs knowledge-private-ci
          exit 1
      - name: Apply private-schema migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/001_private_knowledge.sql
      - name: Apply source lifecycle migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/002_source_lifecycle.sql
      - name: Apply source export audit migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/003_export_audit.sql
      - name: Apply fail-closed workspace access migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/004_workspace_access.sql
      - name: Apply tenant request quota migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/005_rate_limits.sql
      - name: Apply source approval gate migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/006_source_approvals.sql
      - name: Seed synthetic admin-managed entitlements and revocations
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/tests/access-controls.sql
      - name: Verify RLS denies cross-tenant reads and writes
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/tests/rls.sql
      - name: Ensure migration can be reapplied
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/001_private_knowledge.sql
      - name: Reapply source lifecycle migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/002_source_lifecycle.sql
      - name: Reapply source export audit migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/003_export_audit.sql
      - name: Reapply workspace access migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/004_workspace_access.sql
      - name: Reapply request quota migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/005_rate_limits.sql
      - name: Reapply source approval migration
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/migrations/006_source_approvals.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned private database driver
        run: npm ci --prefix private-knowledge --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Audit locked production dependencies
        run: npm audit --prefix private-knowledge --omit=dev --audit-level=high
      - name: Make CI runtime role a restricted login
        run: docker exec knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci -c "ALTER ROLE knowledge_ci_runtime LOGIN PASSWORD 'ci-disposable-password'"
      - name: Execute actual tenant-aware service against PostgreSQL
        env:
          PRIVATE_CI_DATABASE_URL: postgresql://knowledge_ci_runtime:ci-disposable-password@127.0.0.1:5433/knowledgeci
        run: node --test private-knowledge/tests/postgres.integration.test.cjs
      - name: Verify private lifecycle audit using migration-owner
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/tests/lifecycle-audit.sql
      - name: Rehearse complete PostgreSQL backup and restore
        shell: bash
        run: |
          set -euo pipefail
          # Temporary synthetic fixture only: never upload this archive.
          umask 077
          archive="$RUNNER_TEMP/knowledge-private-rehearsal.dump"
          docker exec knowledge-private-ci pg_dump -U postgres -d knowledgeci -Fc > "$archive"
          test -s "$archive"
          docker exec knowledge-private-ci createdb -U postgres knowledge_restore_ci
          docker exec -i knowledge-private-ci pg_restore \
            -U postgres -d knowledge_restore_ci --no-owner --exit-on-error < "$archive"
          docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 \
            -U postgres -d knowledge_restore_ci < private-knowledge/tests/restore.sql
          rm -f "$archive"
      - name: Assert no recovery archive is retained
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/knowledge-private-rehearsal.dump"
      - name: Seed synthetic expired and fresh retention artifacts
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/tests/retention-fixtures.sql
      - name: Preview privileged retention without deleting any data
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -U postgres -d knowledgeci < private-knowledge/maintenance/retention.sql
      - name: Assert default retention preview was non-destructive
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -v expect_pruned=false -U postgres -d knowledgeci < private-knowledge/tests/retention-assert.sql
      - name: Assert retention execution without approval fails safely
        shell: bash
        run: |
          set -euo pipefail
          if docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 \
            -v apply=true -v approved=false -U postgres -d knowledgeci \
            < private-knowledge/maintenance/retention.sql; then
            echo "::error::Unapproved retention command unexpectedly succeeded"
            exit 1
          fi
      - name: Confirm denied retention did not delete anything
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -v expect_pruned=false -U postgres -d knowledgeci < private-knowledge/tests/retention-assert.sql
      - name: Apply explicitly approved bounded retention in disposable CI
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -v apply=true -v approved=true -U postgres -d knowledgeci < private-knowledge/maintenance/retention.sql
      - name: Verify only old quota, replay and expired revocation records were pruned
        run: docker exec -i knowledge-private-ci psql -v ON_ERROR_STOP=1 -v expect_pruned=true -U postgres -d knowledgeci < private-knowledge/tests/retention-assert.sql
      - name: Remove disposable DB
        if: always()
        run: docker rm -f knowledge-private-ci || true

  lockfile:
    name: Maintain reproducible private package lockfile
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [auth-and-tenant-tests, postgres-rls]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate lock from latest source, without force push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 6); do
            git fetch --no-tags origin main
            git reset --hard FETCH_HEAD
            npm install --prefix private-knowledge --package-lock-only --ignore-scripts --no-audit --no-fund
            git add -- private-knowledge/package-lock.json
            if git diff --cached --quiet; then
              echo "Private package lockfile is current"
              exit 0
            fi
            git commit -m "chore(private-knowledge): lock dependencies [skip ci]"
            if git push origin HEAD:main; then
              echo "Updated deterministic private dependency lock"
              exit 0
            fi
            echo "Concurrent main update, retrying from latest source ($attempt/6)"
            sleep 3
          done
          echo "::error::Lockfile update conflicted with concurrent main changes"
          exit 1
