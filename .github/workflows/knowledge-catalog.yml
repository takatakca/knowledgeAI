name: Knowledge Catalog CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Public catalog unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog unit tests
        run: python3 -m unittest discover -s ingest/tests -v
      - name: Build public catalog for API tests
        run: python3 ingest/build_catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate public API syntax
        run: |
          node --check api/search.js
          node --check api/health.js
      - name: Run public API tests
        run: node --test tests/public-api.test.cjs
      - name: Generate and validate public catalog
        run: |
          python3 ingest/build_catalog.py
          python3 ingest/build_catalog.py --check

  publish:
    name: Commit refreshed public catalog
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate public searchable index
        run: python3 ingest/build_catalog.py
      - name: Commit catalog if it changed
        run: |
          git add -- knowledge-catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(knowledge): refresh public search catalog [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

  smoke:
    name: Public production HTTP smoke check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [catalog, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify portal, catalog and read-only APIs through HTTPS
        shell: bash
        run: |
          set -euo pipefail
          base="https://knowledgeai-nu.vercel.app"
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 10 "$base/" -o portal.html \
              && curl -fsSL --max-time 10 "$base/knowledge-catalog.json" -o catalog.json \
              && curl -fsSL --max-time 10 "$base/api/health" -o health.json \
              && curl -fsSL --max-time 10 "$base/api/search?q=TAKATAK&limit=3" -o search.json \
              && node -e '
                const fs = require("fs");
                const portal = fs.readFileSync("portal.html", "utf8");
                const catalog = JSON.parse(fs.readFileSync("catalog.json", "utf8"));
                const health = JSON.parse(fs.readFileSync("health.json", "utf8"));
                const search = JSON.parse(fs.readFileSync("search.json", "utf8"));
                if (!portal.includes("GROUPE TAKATAK") ||
                    catalog.version !== 1 || !Array.isArray(catalog.items) || catalog.items.length < 55 ||
                    health.status !== "ok" || health.records < 55 ||
                    search.visibility !== "public" || !Array.isArray(search.results) || search.total < 1 ||
                    search.results.some(x => !x.source_url.startsWith("https://github.com/takatakca/knowledgeAI/blob/main/"))) {
                  process.exit(1);
                }'; then
              echo "Public portal and API HTTP checks passed"
              exit 0
            fi
            echo "Public deployment not ready or mismatched (attempt $attempt/15)"
            sleep 8
          done
          echo "::error::Public production HTTP smoke checks failed. Inspect Vercel routes, SSO, DNS, and deployment status."
          exit 1
